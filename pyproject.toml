[project]
name = "shop-desk"
version = "0.1.0"
description = "Spec-driven customer desk for a small shop, built on the OpenAI Agents SDK with Gemini."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "openai-agents>=0.22.3",
    "chainlit>=2.12",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
